<!doctype html>
<!-- HTML5 文書型宣言 -->
<html lang="ja">
  <head>
    <!-- 文字エンコーディング: UTF-8（日本語対応） -->
    <meta charset="UTF-8" />

    <!-- レスポンシブデザイン対応: デバイス幅に合わせてレンダリング -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ブラウザタブに表示されるタイトル -->
    <title>つり羅針盤</title>

    <!-- 検索エンジン・SNSシェア時に表示される説明文 -->
    <meta name="description" content="AIが最適な釣りスポットを提案する釣行意思決定アプリ" />

    <!--
      ファビコン（ブラウザタブのアイコン）
      外部ファイルを使わず SVG をインラインで埋め込んでいる
      絵文字（🎣）をそのままアイコンとして使用
    -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎣</text></svg>" />

    <!--
      PWA関連メタタグ（2026-07-25追加）
      manifest.webmanifest と Service Worker の登録は vite-plugin-pwa が
      ビルド時に自動注入するため、ここでは iOS のホーム画面追加対応のみ手動で用意する
      （iOSはWeb App Manifestのicons指定だけでは反映されないため apple-touch-icon が必要）
    -->
    <meta name="theme-color" content="#00c896" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  </head>
  <body>
    <!-- React のマウント先 -->
    <!-- Vite ビルド後、この div に App コンポーネントが描画される -->
    <div id="root"></div>

    <!-- エントリーポイント -->
    <!-- type="module" により ES Modules として読み込む -->
    <!-- Vite が main.tsx をバンドルして配信する -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
