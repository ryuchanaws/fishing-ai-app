# ==============================================================
# template.yaml
#
# 釣行AIアプリ — AWS SAM テンプレート
# CloudFormation スタック名: fishing-ai-app
#
# 構成リソース:
#   - DynamoDB テーブル x6（Spots / Recommendations / Favorites / Posts / Chats / Usage）
#   - Lambda 関数 x8（API系 x6 / バッチ系 x2）
#   - API Gateway（明示的なAWS::Serverless::Apiリソース。Cognitoオーソライザーで一部エンドポイントを保護）
#   - Cognito User Pool + Google IdP（Hosted UI経由のGoogle認証）
#   - EventBridge スケジュール（毎日 AM6:00 JST）
#   - AWS Budgets（月次利用料アラート）
#
# デプロイ:
#   sam build -t infrastructure/template.yaml
#   sam deploy --stack-name fishing-ai-app --capabilities CAPABILITY_IAM
# ==============================================================

AWSTemplateFormatVersion: "2010-09-09"

# AWS SAM 変換マクロを有効化
# SAM 独自のリソース型（AWS::Serverless::Function など）を使用するために必要
Transform: AWS::Serverless-2016-10-31

Description: Fishing AI App - Serverless Backend

# ==============================================================
# グローバル設定
# 全 Lambda 関数・API に共通して適用されるデフォルト値
# ==============================================================
Globals:
  Function:
    Runtime: python3.12   # Python ランタイムバージョン
    Timeout: 60           # デフォルトタイムアウト（秒）
    MemorySize: 256       # デフォルトメモリサイズ（MB）
    Environment:
      Variables:
        # DynamoDB テーブル名を環境変数として各 Lambda に渡す
        # !Ref で論理 ID からテーブル名を動的に取得する
        SPOTS_TABLE: !Ref SpotsTable
        RECOMMENDATIONS_TABLE: !Ref RecommendationsTable
        FAVORITES_TABLE: !Ref FavoritesTable
        POSTS_TABLE: !Ref PostsTable
        CHATS_TABLE: !Ref ChatsTable
        # 1ユーザー・1日あたりのAI呼び出し回数を記録するテーブル（Geminiコスト管理用、2026-07-26追加）
        USAGE_TABLE: !Ref UsageTable
        # ユーザー投稿・スポット写真のアップロード先バケット名
        UPLOADS_BUCKET: !Ref UploadsBucket
        # Gemini API キーを SSM パラメータストアから動的に取得
        # キーは手順1で登録した /fishing-ai/gemini-api-key を参照
        GEMINI_API_KEY: "/fishing-ai/gemini-api-key"
        # 手動バッチ実行 Lambda から呼び出し先 Lambda 名を参照するために設定
       #BATCH_FUNCTION_NAME: !Ref GenerateSpotScoreBatch

Resources:

  # ==============================================================
  # 認証基盤（Cognito User Pool + Google IdP、Hosted UI経由のGoogle認証）
  # 要件定義.html記載の「セキュリティ：Google認証（Cognito）」に対応（2026-07-26追加）
  # ==============================================================

  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: fishing-ai-app-users
      AutoVerifiedAttributes: [email]
      UsernameAttributes: [email]

  # Hosted UIのドメイン。グローバルユニーク制約があるためアカウントIDを含めて衝突を避ける
  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      UserPoolId: !Ref UserPool
      Domain: !Sub "fishing-ai-app-${AWS::AccountId}"

  # Googleを外部IdPとして連携。client_id/secretはSSMに事前登録したものをデプロイ時に動的解決する
  # （{{resolve:ssm...}}はCloudFormationの機能で、SAMのSSMParameterReadPolicyとは別物。
  # ここは実パラメータ名そのものを書くため先頭スラッシュが必要）
  UserPoolGoogleIdP:
    Type: AWS::Cognito::UserPoolIdentityProvider
    Properties:
      UserPoolId: !Ref UserPool
      ProviderName: Google
      ProviderType: Google
      ProviderDetails:
        client_id: "{{resolve:ssm:/fishing-ai/google-oauth-client-id}}"
        client_secret: "{{resolve:ssm-secure:/fishing-ai/google-oauth-client-secret}}"
        authorize_scopes: "email openid profile"
      AttributeMapping:
        email: email
        username: sub

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    DependsOn: UserPoolGoogleIdP
    Properties:
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      SupportedIdentityProviders: [Google]
      AllowedOAuthFlows: [code]
      AllowedOAuthScopes: [email, openid, profile]
      AllowedOAuthFlowsUserPoolClient: true
      CallbackURLs:
        - https://d2ny5ej5kn6jzs.cloudfront.net/
        - https://ryu-chan-fish.ryuchan-aws.workers.dev/
        - http://localhost:5173/
      LogoutURLs:
        - https://d2ny5ej5kn6jzs.cloudfront.net/
        - https://ryu-chan-fish.ryuchan-aws.workers.dev/
        - http://localhost:5173/

  # ==============================================================
  # API Gateway（明示的なリソース。Cognitoオーソライザーを使うため
  # SAMの暗黙的なAPI生成ではなくここで明示的に定義する。
  # 既存のGlobals.Api.Corsはここに統合した）
  # ==============================================================
  Api:
    Type: AWS::Serverless::Api
    Properties:
      StageName: Prod
      Cors:
        AllowMethods: "'GET,POST,DELETE,PUT,OPTIONS'"
        AllowHeaders: "'Content-Type,Authorization'"
        AllowOrigin: "'*'"   # 本番環境では CloudFront ドメインに絞ることを推奨
      Auth:
        Authorizers:
          CognitoAuthorizer:
            UserPoolArn: !GetAtt UserPool.Arn

  # ==============================================================
  # DynamoDB テーブル定義
  # BillingMode: PAY_PER_REQUEST = リクエスト単位課金（個人利用に最適）
  # ==============================================================

  # 釣りスポットマスタ（スポットID・名称・座標・魚種など）
  SpotsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: fishing-spots
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: spotId, AttributeType: S }  # PK: スポットID（文字列）
      KeySchema:
        - { AttributeName: spotId, KeyType: HASH }     # HASH = パーティションキー

  # AI バッチが生成したスコア・推薦理由を保存するテーブル
  RecommendationsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: fishing-recommendations
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: spotId, AttributeType: S }  # PK: スポットID（文字列）
      KeySchema:
        - { AttributeName: spotId, KeyType: HASH }

  # ユーザーのお気に入りスポットを保存するテーブル
  # userId（PK）+ spotId（SK）の複合キーで一意性を担保
  FavoritesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: fishing-favorites
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: userId, AttributeType: S }  # PK: ユーザーID（文字列）
        - { AttributeName: spotId, AttributeType: S }  # SK: スポットID（文字列）
      KeySchema:
        - { AttributeName: userId, KeyType: HASH }     # HASH = パーティションキー
        - { AttributeName: spotId, KeyType: RANGE }    # RANGE = ソートキー

  # 釣果投稿を保存するテーブル
  PostsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: fishing-posts
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: postId, AttributeType: S }  # PK: 投稿ID（文字列）
      KeySchema:
        - { AttributeName: postId, KeyType: HASH }

  # AIチャットの会話履歴を保存するテーブル（1会話=1アイテム、messagesを配列で保持）
  # userId（PK）+ chatId（SK）の複合キーで、FavoritesTableと同じ「ユーザー単位で複数レコード」設計
  ChatsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: fishing-chats
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: userId, AttributeType: S }
        - { AttributeName: chatId, AttributeType: S }
      KeySchema:
        - { AttributeName: userId, KeyType: HASH }
        - { AttributeName: chatId, KeyType: RANGE }

  # ユーザーごとの1日あたりAI呼び出し回数を記録するテーブル（Geminiコスト管理用、2026-07-26追加）
  # dateKeyは "chat#2026-07-26" のような "アクション名#日付" 形式。TTLで2日後に自動削除される
  UsageTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: fishing-usage
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: userId, AttributeType: S }
        - { AttributeName: dateKey, AttributeType: S }
      KeySchema:
        - { AttributeName: userId, KeyType: HASH }
        - { AttributeName: dateKey, KeyType: RANGE }
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true

  # ==============================================================
  # S3 バケット（スポット写真・投稿写真のアップロード先）
  # 書き込みは署名付きURL経由のみ（バケットポリシーは GetObject のみ許可）
  # ==============================================================
  UploadsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "fishing-ai-app-uploads-${AWS::AccountId}"
      CorsConfiguration:
        CorsRules:
          # フロントの本番/開発オリジンいずれからも署名付きURLへアップロードできるよう許可
          # POST: 2026-07-25、署名付きPUT URLから署名付きPOSTフォーム（アップロード上限強制のため）に変更した際に追加
          - AllowedOrigins: ["*"]
            AllowedMethods: [GET, PUT, POST]
            AllowedHeaders: ["*"]
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: false
        RestrictPublicBuckets: false

  UploadsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref UploadsBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal: "*"
            Action: s3:GetObject
            Resource: !Sub "${UploadsBucket.Arn}/*"

  # ==============================================================
  # Lambda 関数定義（API系）
  # CodeUri で指定したディレクトリの requirements.txt を自動インストール
  # Policies で最小権限の IAM ポリシーを付与（最小権限の原則）
  # ==============================================================

  # GET /recommendations — おすすめスポット一覧をスコア降順で返す
  GetRecommendationsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: getRecommendationsHandler
      Handler: handlers.getRecommendationsHandler  # handlers.py の getRecommendationsHandler 関数
      CodeUri: ../backend/lambda/api/
      Policies:
        - DynamoDBReadPolicy: { TableName: !Ref RecommendationsTable }
        - DynamoDBReadPolicy: { TableName: !Ref SpotsTable }
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /recommendations
            Method: GET

  # GET /spots — 全釣りスポット一覧を返す
  GetSpotsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: getSpotsHandler
      Handler: handlers.getSpotsHandler
      CodeUri: ../backend/lambda/api/
      Policies:
        - DynamoDBReadPolicy: { TableName: !Ref SpotsTable }
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /spots
            Method: GET

  # GET /posts — 投稿一覧を新しい順で返す
  GetPostsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: getPostsHandler
      Handler: handlers.getPostsHandler
      CodeUri: ../backend/lambda/api/
      Policies:
        - DynamoDBReadPolicy: { TableName: !Ref PostsTable }
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /posts
            Method: GET

  # GET /favorites — 指定ユーザーのお気に入り一覧を返す
  GetFavoritesFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: getFavoritesHandler
      Handler: handlers.getFavoritesHandler
      CodeUri: ../backend/lambda/api/
      Policies:
        - DynamoDBReadPolicy: { TableName: !Ref FavoritesTable }
        - DynamoDBReadPolicy: { TableName: !Ref SpotsTable }
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /favorites
            Method: GET
            Auth:
              Authorizer: CognitoAuthorizer

  # POST /favorites — お気に入りスポットを追加する
  CreateFavoriteFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: createFavoriteHandler
      Handler: handlers.postFavoritesHandler
      CodeUri: ../backend/lambda/api/
      Policies:
        # CrudPolicy = Create / Read / Update / Delete 全権限
        - DynamoDBCrudPolicy: { TableName: !Ref FavoritesTable }
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /favorites
            Method: POST
            Auth:
              Authorizer: CognitoAuthorizer

  # DELETE /favorites/{spotId} — お気に入りスポットを削除する
  DeleteFavoriteFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: deleteFavoriteHandler
      Handler: handlers.deleteFavoritesHandler
      CodeUri: ../backend/lambda/api/
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref FavoritesTable }
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /favorites/{spotId}
            Method: DELETE
            Auth:
              Authorizer: CognitoAuthorizer

  # POST /posts — 釣果投稿を作成する
  CreatePostFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: createPostHandler
      Handler: handlers.postPostsHandler
      CodeUri: ../backend/lambda/api/
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref PostsTable }
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /posts
            Method: POST
            Auth:
              Authorizer: CognitoAuthorizer

  # DELETE /posts/{postId} — 釣果投稿を削除する
  DeletePostFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: deletePostHandler
      Handler: handlers.deletePostHandler
      CodeUri: ../backend/lambda/api/
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref PostsTable }
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /posts/{postId}
            Method: DELETE
            Auth:
              Authorizer: CognitoAuthorizer

  # PUT /spots/{spotId}/image — スポットの写真URLを設定する
  UpdateSpotImageFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: updateSpotImageHandler
      Handler: handlers.putSpotImageHandler
      CodeUri: ../backend/lambda/api/
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref SpotsTable }
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /spots/{spotId}/image
            Method: PUT
            Auth:
              Authorizer: CognitoAuthorizer

  # POST /uploads/presign — S3への直接アップロード用の署名付きURLを発行する
  PresignUploadFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: presignUploadHandler
      Handler: handlers.postPresignUploadHandler
      CodeUri: ../backend/lambda/api/
      Policies:
        - S3WritePolicy: { BucketName: !Ref UploadsBucket }
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /uploads/presign
            Method: POST
            Auth:
              Authorizer: CognitoAuthorizer

  # POST /chat — AIチャットにメッセージを送信する（新規 or 既存チャットへの追記）
  # 写真添付時はGeminiへマルチモーダル入力として渡すため、S3読み取り権限も付与
  # Timeoutは API Gateway の29秒上限より短く設定し、超過時もLambda側が先にエラーを返せるようにする
  PostChatFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: postChatHandler
      Handler: handlers.postChatHandler
      CodeUri: ../backend/lambda/api/
      Timeout: 25
      Policies:
        - SSMParameterReadPolicy:
            ParameterName: fishing-ai/gemini-api-key
        - S3ReadPolicy: { BucketName: !Ref UploadsBucket }
        - DynamoDBCrudPolicy: { TableName: !Ref ChatsTable }
        # 1日あたりのレート制限カウンタ読み書き用（2026-07-26追加）
        - DynamoDBCrudPolicy: { TableName: !Ref UsageTable }
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /chat
            Method: POST
            Auth:
              Authorizer: CognitoAuthorizer

  # GET /chats — チャット履歴一覧（軽量: chatId/title/updatedAtのみ）を返す
  GetChatsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: getChatsHandler
      Handler: handlers.getChatsHandler
      CodeUri: ../backend/lambda/api/
      Policies:
        - DynamoDBReadPolicy: { TableName: !Ref ChatsTable }
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /chats
            Method: GET
            Auth:
              Authorizer: CognitoAuthorizer

  # GET /chats/{chatId} — 特定チャットの全メッセージを返す（履歴から再開する際に使用）
  GetChatFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: getChatHandler
      Handler: handlers.getChatHandler
      CodeUri: ../backend/lambda/api/
      Policies:
        - DynamoDBReadPolicy: { TableName: !Ref ChatsTable }
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /chats/{chatId}
            Method: GET
            Auth:
              Authorizer: CognitoAuthorizer

  # DELETE /chats/{chatId} — チャットを削除する
  DeleteChatFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: deleteChatHandler
      Handler: handlers.deleteChatHandler
      CodeUri: ../backend/lambda/api/
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref ChatsTable }
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /chats/{chatId}
            Method: DELETE
            Auth:
              Authorizer: CognitoAuthorizer

  # ==============================================================
  # Lambda 関数定義（バッチ系）
  # ==============================================================

  # 全スポットのスコア計算 + Gemini API による推薦理由生成バッチ
  # 2026-07-24: 新規スポット探索（discover_spots.run_discovery）もこの中で実行するようになったため
  # （「AI分析を実行」が新スポット探索も兼ねる）、Timeoutを300→420秒に拡張し、
  # SpotsTableへの書き込み権限（discover_spots用）とPlaces APIキーの読み取り権限を追加している
  # MemorySize: 512MB（大きめに設定してコールドスタートを抑制）
  GenerateSpotScoreBatch:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: generateSpotScoreBatch
      Handler: generate_score.handler
      CodeUri: ../backend/lambda/batch/
      Timeout: 420     # 新スポット探索 + 全スポットのスコア計算を合わせた時間を考慮
      MemorySize: 512  # API系のデフォルト256MBより大きく設定
      Policies:
        - SSMParameterReadPolicy:
            # SAM の SSMParameterReadPolicy は内部で "parameter/${ParameterName}" として
            # ARN を組み立てるため、先頭にスラッシュを付けると "parameter//..." という
            # 二重スラッシュのARNになり実際のパラメータと一致しなくなる（AccessDenied の原因）。
            # そのため先頭のスラッシュを付けない。
            ParameterName: fishing-ai/gemini-api-key
        - SSMParameterReadPolicy:
            # discover_spots.run_discovery が使う Google Places API キー
            ParameterName: fishing-ai/google-places-api-key
        - DynamoDBCrudPolicy:
            # run_discovery が新規スポットを書き込むため Read のみでは不足（2026-07-24変更）
            TableName: !Ref SpotsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref RecommendationsTable
      Events:
        # EventBridge スケジュール（毎日 AM6:00 JST = 21:00 UTC に自動実行）
        # cron 形式: cron(分 時 日 月 曜日 年)
        Schedule:
          Type: Schedule
          Properties:
            Schedule: cron(0 21 * * ? *)
            Enabled: true

  # POST /admin/run-ai-batch — フロントの「AI実行ボタン」から手動でバッチを起動する
  # GenerateSpotScoreBatch を非同期呼び出し（Event）するため、この関数自体はすぐ返る。
  # Timeout はやや余裕を持たせて330秒としているが、実際は数秒で完了する
  AdminRunAiBatchFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: adminRunAiBatch
      Handler: admin_trigger.handler
      CodeUri: ../backend/lambda/batch/
      Timeout: 330
      Environment:
        Variables:
          BATCH_FUNCTION_NAME: !Ref GenerateSpotScoreBatch
      Policies:
        # GenerateSpotScoreBatch の invoke 権限のみ付与（最小権限の原則）
        - LambdaInvokePolicy: { FunctionName: !Ref GenerateSpotScoreBatch }
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /admin/run-ai-batch
            Method: POST
            Auth:
              Authorizer: CognitoAuthorizer

  # 新規釣りスポット候補を Google Places API で探索し、Spots テーブルに追加するバッチ
  # 既存スポットとの重複（緯度経度が近い）は除外する
  #
  # 2026-07-24: 全国探索の自動スケジュールは廃止した（GenerateSpotScoreBatch が
  # 「AI分析を実行」のたびに位置指定なしの探索も行うようになったため、週次の自動探索は冗長）。
  # この関数は POST /admin/run-spot-discovery（フロントの「現在地から探す」ボタン）専用として、
  # ユーザーの現在地(lat/lng)を指定した近傍探索のためだけに呼び出される
  DiscoverSpotsBatch:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: discoverSpotsBatch
      Handler: discover_spots.handler
      CodeUri: ../backend/lambda/batch/
      Timeout: 120
      MemorySize: 256
      Policies:
        - SSMParameterReadPolicy:
            # SSMParameterReadPolicy の ParameterName には先頭スラッシュを付けない
            # （付けると parameter//... という二重スラッシュARNになりAccessDeniedになる。GenerateSpotScoreBatch と同じ注意点）
            ParameterName: fishing-ai/google-places-api-key
        - SSMParameterReadPolicy:
            # 想定される魚種の推測にGemini APIも使うため、同じキーへの読み取り権限も付与
            ParameterName: fishing-ai/gemini-api-key
        - DynamoDBCrudPolicy:
            TableName: !Ref SpotsTable

  # POST /admin/run-spot-discovery — フロントの「現在地から探す」ボタンから
  # DiscoverSpotsBatch を起動する（リクエストボディの lat/lng をそのまま転送する）。
  # admin_trigger.py は BATCH_FUNCTION_NAME 環境変数で呼び出し先を切り替えられる汎用実装のため
  # AdminRunAiBatchFunction と同じハンドラコードを異なる環境変数で再利用する
  AdminRunSpotDiscoveryFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: adminRunSpotDiscovery
      Handler: admin_trigger.handler
      CodeUri: ../backend/lambda/batch/
      Environment:
        Variables:
          BATCH_FUNCTION_NAME: !Ref DiscoverSpotsBatch
      Policies:
        - LambdaInvokePolicy: { FunctionName: !Ref DiscoverSpotsBatch }
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /admin/run-spot-discovery
            Method: POST
            Auth:
              Authorizer: CognitoAuthorizer

  # ==============================================================
  # AWS利用料アラート（月$10、80%/100%到達時にメール通知。2026-07-26追加）
  # Gemini/Places等のGoogle Cloud側課金はAWS Budgetsでは検知できないため対象外
  # （README にGoogle Cloud側の予算アラート設定手順を別途記載）
  # ==============================================================
  CostBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: fishing-ai-app-monthly
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount: "10"
          Unit: USD
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 80
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: rfunao0955@gmail.com
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: rfunao0955@gmail.com

# ==============================================================
# スタック出力
# SAM デプロイ後にコンソールや GitHub Secrets に設定する値
# ==============================================================
Outputs:
  ApiEndpoint:
    Description: "API Gateway のエンドポイント URL（VITE_API_BASE_URL に設定すること）"
    # 明示的なApiリソース（論理ID: Api）を使うようになったため ${ServerlessRestApi} ではなく ${Api} を参照する
    Value: !Sub "https://${Api}.execute-api.${AWS::Region}.amazonaws.com/Prod"
  UploadsBucketName:
    Description: "スポット写真・投稿写真のアップロード先S3バケット名"
    Value: !Ref UploadsBucket
  UserPoolId:
    Description: "Cognito User Pool ID（フロントエンドの src/auth/authConfig.ts に設定すること）"
    Value: !Ref UserPool
  UserPoolClientId:
    Description: "Cognito User Pool Client ID（フロントエンドの src/auth/authConfig.ts に設定すること）"
    Value: !Ref UserPoolClient
  CognitoHostedUiDomain:
    Description: "Cognito Hosted UIのドメイン。Google Cloud ConsoleのOAuthクライアントで承認済みリダイレクトURIに <この値>/oauth2/idpresponse を登録すること"
    Value: !Sub "https://fishing-ai-app-${AWS::AccountId}.auth.${AWS::Region}.amazoncognito.com"