name: Test Fishing AI App

# ─────────────────────────────────────────────
# トリガー設定
# - mainブランチへのPull Request作成/更新時に自動実行
# - デプロイ（deploy.yml）はmainへのpush時のみ実行される別ワークフローのため、
#   ここではテストのみを行い、AWS/Cloudflareへのデプロイは一切行わない
# ─────────────────────────────────────────────
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

# ─────────────────────────────────────────────
# アプリ本体はリポジトリ直下ではなく src/fishing-ai-app/ にあるため、
# 全 run ステップのカレントディレクトリをそこに固定する
# ─────────────────────────────────────────────
defaults:
  run:
    working-directory: src/fishing-ai-app

jobs:
  # ═══════════════════════════════════════════
  # JOB 1: バックエンドユニットテスト（pytest）
  # 実AWSには接続せず、moto でDynamoDBをモックする
  # ═══════════════════════════════════════════
  backend-tests:
    name: Backend Unit Tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            src/fishing-ai-app/backend/requirements-dev.txt
            src/fishing-ai-app/backend/lambda/api/requirements.txt
            src/fishing-ai-app/backend/lambda/batch/requirements.txt

      - name: Install dependencies
        run: |
          pip install \
            -r backend/requirements-dev.txt \
            -r backend/lambda/api/requirements.txt \
            -r backend/lambda/batch/requirements.txt

      - name: Run pytest
        run: pytest backend/tests -v

  # ═══════════════════════════════════════════
  # JOB 2: フロントエンドユニットテスト（Vitest）
  # ═══════════════════════════════════════════
  frontend-unit-tests:
    name: Frontend Unit Tests (Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: src/fishing-ai-app/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: src/fishing-ai-app/frontend

      - name: Run Vitest
        run: npm run test
        working-directory: src/fishing-ai-app/frontend

  # ═══════════════════════════════════════════
  # JOB 3: E2Eテスト + VRT（Playwright）
  # 実AWSには接続せず、各テスト内でAPIレスポンスをモックする（e2e/fixtures.ts）
  # ═══════════════════════════════════════════
  frontend-e2e-tests:
    name: Frontend E2E + Visual Tests (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: src/fishing-ai-app/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: src/fishing-ai-app/frontend

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: src/fishing-ai-app/frontend

      - name: Build
        run: npm run build
        working-directory: src/fishing-ai-app/frontend

      - name: Run Playwright tests
        run: npx playwright test
        working-directory: src/fishing-ai-app/frontend

      # VRTの差分やエラーコンテキストを確認できるよう、失敗時のみレポートを保存する
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: src/fishing-ai-app/frontend/playwright-report/
          retention-days: 14
